# Fast checks on every pull request and every push to main: formatting, the rebrand guard,
# dependency layering, asset attribution and the PDF dependency pin; the core crates' tests on
# Linux and Windows with a check that the desktop app builds on both; and on Linux the
# app's own unit tests (control server and token, arguments), the automation bridge, the media and
# interchange crates (they use FilmCraft's codecs, pinned to 685ks/filmcraft), the engine's links,
# help and settings, and the UI crate's unit tests. The full workspace suite is `cargo xtask ci`
# (run it locally).
#
# Every action is pinned by commit SHA. Values from the event go through `env:`, never straight
# into a `run:` script.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      # This fork carries no ArtCraft marks or links and no storytold/craft-common-actions
      # workflows (house rules). LICENSE and NOTICE keep the upstream copyright line.
      - name: Rebrand guard
        run: |
          set -euo pipefail
          if git grep -nI 'craft-common-actions' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::storytold/craft-common-actions is not used in this fork"; exit 1
          fi
          if git grep -nIi -e 'getartcraft\.com' -e 'discord\.gg/artcraft' -e 'ai\.storyteller\.effectcraft' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::ArtCraft/storyteller links or ids remain"; exit 1
          fi
          if git grep -nI -e 'github\.com/storytold/craft-libs' -e 'github\.com/storytold/filmcraft' -- Cargo.toml Cargo.lock; then
            echo "::error::git dependencies must come from 685ks, not storytold"; exit 1
          fi
          if [ -d docs/brand ]; then echo "::error::docs/brand (ArtCraft marks) must not exist"; exit 1; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency layering
        run: cargo xtask layers
      - name: Asset attribution
        run: cargo xtask assets
      - name: PDF dependency pin
        run: cargo xtask pdf-deps

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Linux system dependencies (egui/winit/rfd/cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Time, geometry, colour, keyframes, paths, the data model, the project file format, the
      # text engine and the expression language: the foundations every other crate stands on, and
      # the ones whose behaviour can differ by platform (paths, line endings, floating point, fonts).
      - name: Test core crates
        shell: bash
        run: >-
          cargo test --locked --lib --tests
          -p effectcraft-time -p effectcraft-geom -p effectcraft-color -p effectcraft-keyframe
          -p effectcraft-path -p effectcraft-model -p effectcraft-project -p effectcraft-text
          -p effectcraft-expr
      - name: Check the desktop app and CLI build
        run: cargo check --locked -p effectcraft -p effectcraft-cli --bins

  app:
    name: app tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Free disk space and install Linux system dependencies
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The desktop app's unit tests (control server and its token, arguments, packaging ids) and
      # the MCP bridge (it authenticates with the token).
      - name: Test the app and the automation bridge
        run: cargo test --locked --bins --lib -p effectcraft -p effectcraft-automation
      # These read and write media through FilmCraft's codec crates.
      - name: Test media and interchange
        run: cargo test --locked --lib --tests -p effectcraft-media -p effectcraft-interchange
      - name: Engine links, help and settings
        run: cargo test --locked -p effectcraft-engine --lib -- links help settings
      - name: Test the UI crate
        run: cargo test --locked -p effectcraft-ui-egui --lib
      - name: Header, About and Home links
        run: cargo test --locked -p effectcraft-ui-egui --test ui_panels
